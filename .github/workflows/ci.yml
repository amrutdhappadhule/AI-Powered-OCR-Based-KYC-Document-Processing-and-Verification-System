name: KYC OCR - CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify Python
        run: python --version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Python syntax
        run: |
          python -m compileall -q .

      - name: Build Docker image
        run: docker build -t kyc-ocr-app:latest .

# 3.3 Understand what each part does
#YAML setting	Purpose
#name	Names the workflow in GitHub Actions.
# on	Defines when it runs: on pushes and pull requests targeting main.
#jobs	Defines the work GitHub should perform.
#runs-on	Requests a GitHub-hosted Ubuntu runner.
#checkout	Downloads your repository code into the runner.
#setup-python	Sets up the requested Python version.
#pip install	Installs the project's dependencies.
