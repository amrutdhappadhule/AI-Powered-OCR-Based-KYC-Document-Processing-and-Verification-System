name: KYC OCR - CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify Python
        run: python --version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Python syntax
        run: |
          python -m compileall -q .

      - name: Build Docker image
        run: docker build -t kyc-ocr-app:latest .

      - name: Login to Azure using OIDC
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Login to Azure Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: az acr login --name kycsystem

      - name: Tag and push Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag kyc-ocr-app:latest kycsystem.azurecr.io/kyc-ocr-app:${{ github.sha }}
          docker tag kyc-ocr-app:latest kycsystem.azurecr.io/kyc-ocr-app:latest

          docker push kycsystem.azurecr.io/kyc-ocr-app:${{ github.sha }}
          docker push kycsystem.azurecr.io/kyc-ocr-app:latest

      - name: Deploy to Azure Container Apps
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          az extension add --name containerapp --upgrade
          az containerapp update \
            --name kyc-ocr-app \
            --resource-group kyc-cicd \
            --image kycsystem.azurecr.io/kyc-ocr-app:${{ github.sha }}
